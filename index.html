    function formatAzDate(isoDateStr) {
      try {
        const parts = isoDateStr.split('-');
        if (parts.length === 3) {
          const year = parseInt(parts[0], 10);
          const monthIdx = parseInt(parts[1], 10) - 1;
          const day = parseInt(parts[2], 10);
          if (!isNaN(day) && monthIdx >= 0 && monthIdx < 12 && !isNaN(year)) {
            return `${day} ${AZ_MONTHS[monthIdx]} ${year}`;
          }
        }
      } catch (e) {}
      return '20 noyabr 2026';
    }

    function isMemberPassive(memberLike) {
      if (!memberLike) return false;
      const lastAction = memberLike.lastRsvpMs || 0;
      return (NOW_MS - lastAction) >= TWO_MONTHS_MS;
    }

    function checkPassiveMembersAndNotify(targetUser) {
      const candidates = targetUser ? [targetUser] : [state.currentUser, ...state.members];
      candidates.forEach((person) => {
        if (!person || person.isRegistered === false) return;
        if (isMemberPassive(person) && !person.passiveNotified) {
          person.passiveNotified = true;
          if (!state.dmThreads[person.id]) {
            state.dmThreads[person.id] = [];
          }
          const alreadyHas = state.dmThreads[person.id].some((m) => m.text === PASSIVE_REMINDER_TEXT);
          if (!alreadyHas) {
            state.dmThreads[person.id].push({
              id: 'passive-' + Date.now() + '-' + person.id,
              fromMe: false,
              text: PASSIVE_REMINDER_TEXT,
              time: 'Avtomatik (2 ay)',
            });
          }
          if (person.id === state.currentUser.id) {
            showToast(PASSIVE_REMINDER_TEXT);
          }
        }
      });
    }

    function openRoleModal(mode = 'login') {
      state.authModalMode = mode;

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');

    function handlePinLogin() {
      const phoneVal = (document.getElementById('loginPhoneInput')?.value || '').trim();
      const pinVal = (document.getElementById('loginPinInput')?.value || '').trim();
      const errEl = document.getElementById('loginErrorMsg');

      if (!phoneVal) {
        errEl.textContent = 'Telefon nömrəsi daxil edilməlidir.';
        errEl.classList.remove('hidden');
        return;
      }

      if (!/^\d{6}$/.test(pinVal)) {
        errEl.textContent = '6 rəqəmli parol daxil edin.';
        errEl.classList.remove('hidden');
        return;
      }

      const inputDigits = normalizePhoneDigits(phoneVal);

      const matchedMember = state.members.find(
        (m) =>
          m.isRegistered === true &&
          m.pin === pinVal &&
          normalizePhoneDigits(m.phone).includes(inputDigits)
      );

      if (!matchedMember) {
        errEl.innerHTML = 'Bu nömrə və parol ilə hesab tapılmadı və ya hələ təsdiqlənməyib.';
        errEl.classList.remove('hidden');
        return;
      }

      errEl.classList.add('hidden');
      state.role = matchedMember.status === 'creator' ? 'creator' : (matchedMember.role === 'admin' ? 'admin' : 'member');
      state.currentUser = { ...matchedMember };
      closeAuthModal();
      render();
      showToast(`Xoş gəldiniz, ${matchedMember.firstName}!`);
    }

    function handleRegisterSubmit() {
      const fn = (document.getElementById('regFirstName')?.value || '').trim();
      const ln = (document.getElementById('regLastName')?.value || '').trim();
      const ph = (document.getElementById('regPhone')?.value || '').trim();
      let nick = (document.getElementById('regNick')?.value || '').trim();
      const pin = (document.getElementById('regPin')?.value || '').trim();
      const errEl = document.getElementById('regErrorMsg');

      if (!fn || !ln || !ph) {
        errEl.textContent = 'Ad, soyad və telefon nömrəsini doldurun.';
        errEl.classList.remove('hidden');
        return;
      }

      if (!nick || nick.replace(/^@/, '').length < 3) {
        errEl.textContent = 'Nik mütləq daxil edilməli və ən azı 3 hərfdən ibarət olmalıdır.';
        errEl.classList.remove('hidden');
        return;
      }

      if (!nick.startsWith('@')) nick = '@' + nick;

      if (!/^\d{6}$/.test(pin)) {
        errEl.textContent = 'Parol mütləq 6 rəqəmdən ibarət olmalıdır.';
        errEl.classList.remove('hidden');
        return;
      }

      errEl.classList.add('hidden');
      const newId = 'u-' + Date.now();

      const pendingUser = {
        id: newId,
        firstName: fn,
        lastName: ln,
        phone: ph,
        pin: pin,
        nickname: nick,
        status: 'aktiv',
        hidePhone: false,
        isRegistered: true,
        approvedByAdmin: false,
        role: 'member',
        lastRsvpMs: NOW_MS,
        passiveNotified: false,
      };

      state.pendingRegistrations.push(pendingUser);
      closeAuthModal();
      showToast('Qeydiyyat müraciətiniz göndərildi. Admin təsdiqlədikdən sonra hesabınız aktivləşəcək.');
      render();
    }

    function approveUserByAdmin(userId) {
      const idx = state.pendingRegistrations.findIndex((u) => u.id === userId);
      if (idx >= 0) {
        const u = state.pendingRegistrations[idx];
        u.approvedByAdmin = true;
        state.members.push(u);
        state.pendingRegistrations.splice(idx, 1);
        showToast(`${u.firstName} ${u.lastName} qeydiyyatı təsdiqləndi!`);
        render();
      }
    }

    function creatorChangeMemberStatus(memberId, newStatus) {
      if (state.role !== 'creator') return;
      const member = state.members.find((m) => m.id === memberId);
      if (!member) return;
      const prevStatus = member.status || (member.role === 'admin' ? 'admin' : 'aktiv');
      member.status = newStatus;
      member.role = newStatus === 'admin' ? 'admin' : 'member';
      if (state.currentUser.id === memberId) {
        state.currentUser.status = newStatus;
        state.currentUser.role = member.role;
      }
      render();
      showToast(`${member.firstName} ${member.lastName} statusu "${newStatus}" olaraq dəyişdirildi.`);
    }

    function handleRsvp(announcementId, choice) {
      if (state.role === 'guest') {
        showToast('Elanlara qoşulmaq üçün əvvəlcə giriş edin.');
        openRoleModal('login');
        return;
      }

      const ann = state.announcements.find((a) => a.id === announcementId);
      if (!ann) return;

      const userId = state.currentUser.id;
      const fullName = `${state.currentUser.firstName} ${state.currentUser.lastName}`;
      const existingIdx = ann.attendees.findIndex((item) => item.userId === userId);

      if (existingIdx >= 0) {
        ann.attendees[existingIdx].status = choice;
        ann.attendees[existingIdx].name = fullName;
      } else {
        ann.attendees.push({ userId, name: fullName, status: choice });
      }

      state.currentUser.lastRsvpMs = NOW_MS;
      render();
      showToast('Seçiminiz qeydə alındı.');
    }

    function toggleChatLock() {
      if (state.role !== 'admin' && state.role !== 'creator') return;
      state.chatLocked = !state.chatLocked;
      render();
      showToast(state.chatLocked ? 'Söhbət bağlandı.' : 'Söhbət açıldı.');
    }

    function sendGroupMessage() {
      if (state.role === 'guest' || (state.chatLocked && state.role !== 'admin' && state.role !== 'creator')) return;
      const input = document.getElementById('groupChatInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      state.chatMessages.push({
        id: 'm-' + Date.now(),
        senderNick: state.currentUser.nickname || '@uzv',
        senderName: `${state.currentUser.firstName} ${state.currentUser.lastName}`,
        senderStatus: state.role === 'creator' ? 'creator' : (state.role === 'admin' ? 'admin' : (state.currentUser.status || 'aktiv')),
        isAdmin: state.role === 'admin' || state.role === 'creator',
        text,
        time: 'İndi',
      });

      input.value = '';
      render();
    }

    function sendDirectMessage() {
      if (state.role === 'guest') return;
      const input = document.getElementById('dmInput');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;

      const targetId = state.selectedDmUserId;
      if (!state.dmThreads[targetId]) state.dmThreads[targetId] = [];
      state.dmThreads[targetId].push({
        id: 'dm-' + Date.now(),
        fromMe: true,
        text,
        time: 'İndi',
      });

      input.value = '';
      render();
    }

          <div class="flex-1 min-h-0 overflow-y-auto soft-scroll p-3.5 space-y-2.5 bg-[#F7F6FC]">
            ${state.chatMessages
              .map((m) => {
                const isMine = m.senderNick === state.currentUser.nickname;
                return `
                  <div class="flex flex-col ${isMine ? 'items-end' : 'items-start'}">
                    <div class="mb-1 flex items-center gap-1.5">
                      <span class="text-xs font-bold text-purple-950">${m.senderNick}</span>
                      ${m.senderStatus ? getStatusBadgeHtml(m.senderStatus) : ''}
                    </div>
                    <div class="max-w-[85%] px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm shadow-2xs ${
                      isMine ? 'bg-purple-700 text-white' : 'bg-white text-purple-950 border border-purple-100'
                    }">
                      ${m.text}
                    </div>
                    <span class="text-[10px] text-slate-400 mt-0.5">${m.time}</span>
                  </div>
                `;
              })
              .join('')}
          </div>

          <div class="p-2.5 bg-white border-t border-purple-100 shrink-0">
            ${
              canWrite
                ? `<div class="flex gap-2">
                     <input
                       id="groupChatInput"
                       type="text"
                       placeholder="Mesaj yazın..."
                       onkeydown="if(event.key==='Enter'){sendGroupMessage();}"
                       class="flex-1 rounded-xl border border-purple-200 px-3.5 py-2.5 text-xs sm:text-sm focus:outline-none focus:border-purple-500"
                     />
                     <button type="button" onclick="sendGroupMessage()" class="px-4 py-2.5 rounded-xl bg-purple-700 text-white text-xs sm:text-sm font-bold">Göndər</button>
                   </div>`
                : `<div class="text-center py-2 text-xs font-bold text-rose-700 bg-rose-50 rounded-xl border border-rose-200">
                     Söhbət adminlər tərəfindən bağlanıb.
                   </div>`
            }
          </div>
        </div>
      `;
    }

    function renderDirectMessagesView() {
      if (state.role === 'guest') {
        return `
          <div class="h-full flex flex-col items-center justify-center text-center px-5 space-y-4">
            <div class="text-base font-extrabold text-purple-950">Şəxsi mesaj bölməsi</div>
            <button type="button" onclick="openRoleModal('login')" class="px-5 py-3 rounded-xl bg-purple-700 text-white text-xs sm:text-sm font-bold">Giriş et</button>
          </div>
        `;
      }

      const peers = state.members.filter((m) => m.id !== state.currentUser.id);
      const selectedPeer = peers.find((p) => p.id === state.selectedDmUserId) || peers[0];

      const peerMessages = selectedPeer ? (state.dmThreads[selectedPeer.id] || []) : [];

      return `
        <div class="flex flex-col h-full min-h-0 space-y-2">
          <div class="flex gap-2 overflow-x-auto pb-1 shrink-0">
            ${peers.map((p) => `
              <button type="button" onclick="state.selectedDmUserId='${p.id}'; render();" class="px-3.5 py-2 rounded-xl text-xs font-bold border ${p.id === state.selectedDmUserId ? 'bg-purple-700 text-white' : 'bg-white text-purple-950'}">${p.firstName} ${p.lastName}</button>
            `).join('')}
          </div>
          <div class="flex-1 min-h-0 bg-white rounded-2xl border border-purple-100 flex flex-col overflow-hidden">
            <div id="dmMessagesScroll" class="flex-1 overflow-y-auto p-3 space-y-2.5 min-h-0">
              ${peerMessages.map((m) => `
                <div class="flex flex-col ${m.fromMe ? 'items-end' : 'items-start'}">
                  <div class="max-w-[82%] px-3.5 py-2.5 rounded-2xl text-xs sm:text-sm ${m.fromMe ? 'bg-cyan-600 text-white' : 'bg-white text-purple-950 border border-purple-100'}">${m.text}</div>
                </div>
              `).join('')}
            </div>
            <div class="p-2 bg-white border-t border-purple-100 flex gap-2 shrink-0">
              <input id="dmInput" type="text" placeholder="Şəxsi mesaj..." class="flex-1 rounded-xl border border-purple-200 px-3.5 py-2.5 text-xs sm:text-sm" />
              <button type="button" onclick="sendDirectMessage()" class="px-4 py-2.5 rounded-xl bg-cyan-600 text-white text-xs sm:text-sm font-bold">Göndər</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderMembersView() {
      const isGuest = state.role === 'guest';
      const isCreator = state.role === 'creator';
      const rankOrder = { creator: 0, admin: 1, moder: 2, old: 3, aktiv: 4 };
      const sortedMembers = [...state.members].sort((a, b) => {
        const ra = rankOrder[a.status || (a.role === 'admin' ? 'admin' : 'aktiv')] ?? 4;
        const rb = rankOrder[b.status || (b.role === 'admin' ? 'admin' : 'aktiv')] ?? 4;
        return ra - rb;
      });

      return `
        <div class="space-y-3.5">
          <div class="bg-white rounded-2xl p-3.5 border border-purple-100 shadow-xs">
            <h2 class="text-xs sm:text-sm font-extrabold text-purple-950">Klub Üzvləri (${sortedMembers.length})</h2>
          </div>
          <div class="space-y-2.5">
            ${sortedMembers.map((m) => {
              const currentStatus = m.status || (m.role === 'admin' ? 'admin' : 'aktiv');
              return `
                <div class="bg-white rounded-2xl p-3.5 border border-purple-100 space-y-2.5 shadow-2xs">
                  <div class="flex items-center justify-between">
                    <div>
                      <div class="mb-1">${getStatusBadgeHtml(currentStatus)}</div>
                      <div class="text-xs sm:text-sm font-extrabold text-purple-950 ${isGuest ? 'guest-blur' : ''}">${m.firstName} ${m.lastName}</div>
                      ${isGuest ? '' : `<div class="text-xs text-slate-600 mt-0.5">${m.phone} • <span class="text-purple-700 font-semibold">${m.nickname}</span></div>`}
                    </div>
                  </div>
                  ${
                    isCreator && m.id !== state.currentUser.id
                      ? `<div class="pt-2 border-t border-purple-100 flex flex-wrap items-center justify-between gap-1.5">
                           <span class="text-[11px] font-bold text-purple-900">Statusu dəyiş:</span>
                           <div class="flex flex-wrap gap-1">
                             <button type="button" onclick="creatorChangeMemberStatus('${m.id}', 'admin')" class="px-2 py-1 rounded-lg text-[11px] font-bold ${currentStatus === 'admin' ? 'bg-blue-900 text-white' : 'bg-blue-50 text-blue-900 border border-blue-200'}">Admin et</button>
                             <button type="button" onclick="creatorChangeMemberStatus('${m.id}', 'moder')" class="px-2 py-1 rounded-lg text-[11px] font-bold ${currentStatus === 'moder' ? 'bg-sky-600 text-white' : 'bg-sky-50 text-sky-800 border border-sky-200'}">Moder et</button>
                             <button type="button" onclick="creatorChangeMemberStatus('${m.id}', 'old')" class="px-2 py-1 rounded-lg text-[11px] font-bold ${currentStatus === 'old' ? 'bg-orange-500 text-white' : 'bg-orange-50 text-orange-800 border border-orange-200'}">Old et</button>
                             <button type="button" onclick="creatorChangeMemberStatus('${m.id}', 'aktiv')" class="px-2 py-1 rounded-lg text-[11px] font-bold ${currentStatus === 'aktiv' ? 'bg-purple-700 text-white' : 'bg-purple-50 text-purple-800 border border-purple-200'}">Aktiv et</button>
                           </div>
                         </div>`
                      : ''
                  }
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderAccountView() {
      const u = state.currentUser;
      if (state.role === 'guest') {
        return `
          <div class="bg-white rounded-2xl p-5 border border-purple-100 text-center space-y-4 shadow-xs">
            <div class="text-base font-extrabold text-purple-950">Hesab Bölməsi</div>
            <div class="flex gap-2">
              <button type="button" onclick="openRoleModal('login')" class="flex-1 py-3 rounded-xl bg-purple-700 text-white text-xs sm:text-sm font-bold">Giriş</button>
              <button type="button" onclick="openRoleModal('register')" class="flex-1 py-3 rounded-xl bg-cyan-600 text-white text-xs sm:text-sm font-bold">Qeydiyyat</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-purple-100 space-y-3 shadow-xs">
            <div class="flex items-center justify-between border-b border-purple-100 pb-2">
              <h2 class="text-xs sm:text-sm font-extrabold text-purple-950">Qeydiyyat Məlumatları</h2>
              <button type="button" onclick="state.role='guest'; state.currentUser={...GUEST_ACCOUNT}; render();" class="text-xs font-bold text-rose-600 hover:underline">Çıxış et</button>
            </div>

            <div class="space-y-2.5 text-xs sm:text-sm">
              <div class="flex items-center justify-between p-2.5 bg-purple-50/60 rounded-xl">
                <span class="text-slate-500 font-medium">Ad: <b class="text-purple-950 ml-1">${u.firstName}</b></span>
              </div>
              <div class="flex items-center justify-between p-2.5 bg-purple-50/60 rounded-xl">
                <span class="text-slate-500 font-medium">Soyad: <b class="text-purple-950 ml-1">${u.lastName}</b></span>
              </div>
              <div class="flex items-center justify-between p-2.5 bg-purple-50/60 rounded-xl">
                <span class="text-slate-500 font-medium">Telefon: <b class="text-purple-950 ml-1">${u.phone}</b></span>
              </div>
              <div class="flex items-center justify-between p-2.5 bg-cyan-50/60 rounded-xl border border-cyan-100">
                <span class="text-slate-500 font-medium">Nik: <b class="text-cyan-950 ml-1">${u.nickname}</b></span>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      checkPassiveMembersAndNotify();
      renderTopRoleBadge();
      updateNavStyles();
      const container = document.getElementById('mainContainer');
      if (state.activeTab === 'home') container.innerHTML = renderHomeView();
      else if (state.activeTab === 'announcements') container.innerHTML = renderAnnouncementsView();
      else if (state.activeTab === 'chat') container.innerHTML = renderChatView();
      else if (state.activeTab === 'dm') container.innerHTML = renderDirectMessagesView();
      else if (state.activeTab === 'members') container.innerHTML = renderMembersView();
      else if (state.activeTab === 'account') container.innerHTML = renderAccountView();
    }

    window.onload = function () {
      render();
    };
  </script>
</body>
</html>
