    function saveState() {
      localStorage.setItem('apex_user', JSON.stringify(state.currentUser));
      localStorage.setItem('apex_members', JSON.stringify(state.members));
      localStorage.setItem('apex_pending', JSON.stringify(state.pendingRegistrations));
      localStorage.setItem('apex_feed', JSON.stringify(state.feed));
      localStorage.setItem('apex_announcements', JSON.stringify(state.announcements));
    }

    function showToast(msg) {
      const banner = document.getElementById('toastBanner');
      const textEl = document.getElementById('toastText');
      if (!banner || !textEl) return;
      textEl.textContent = msg;
      banner.classList.remove('hidden');
      setTimeout(() => banner.classList.add('hidden'), 5000);
    }

    function hideToast() {
      document.getElementById('toastBanner').classList.add('hidden');
    }

    function requireMemberAction(callback) {
      if (state.currentUser.role === 'guest') {
        showToast('🔒 Bu klub üzvləri ilə qarşılıqlı əlaqədə olmaq üçün qeydiyyatdan keçmək lazımdır.');
        openAuthModal('register');
        return false;
      }
      return callback();
    }

    function renderTopRoleBadge() {
      const badge = document.getElementById('topRoleBadge');
      const role = state.currentUser.role;
      const status = state.currentUser.status || role;

      if (role === 'guest') {
        badge.className = 'px-3 py-1.5 rounded-full text-xs font-bold border bg-cyan-50 text-cyan-800 border-cyan-200';
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-cyan-500"></span>Qonaq / Giriş`;
      } else if (status === 'creator') {
        badge.className = 'px-3 py-1.5 rounded-full text-xs font-bold border bg-purple-900 text-purple-100 border-purple-950';
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-fuchsia-300"></span>Yaradıcı`;
      } else if (status === 'admin') {
        badge.className = 'px-3 py-1.5 rounded-full text-xs font-bold border bg-blue-900 text-white border-blue-950';
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-cyan-300"></span>Admin`;
      } else if (status === 'moder') {
        badge.className = 'px-3 py-1.5 rounded-full text-xs font-bold border bg-sky-800 text-white border-sky-900';
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-sky-300"></span>Moder`;
      } else {
        badge.className = 'px-3 py-1.5 rounded-full text-xs font-bold border bg-purple-100 text-purple-800 border-purple-200';
        badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-purple-600"></span>${state.currentUser.firstName}`;
      }
    }

    function getStatusBadgeHtml(statusKey) {
      const map = {
        creator: { text: 'yaradıcı', cls: 'bg-purple-100 text-purple-800 border-purple-300' },
        admin: { text: 'admin', cls: 'bg-blue-100 text-blue-900 border-blue-300' },
        moder: { text: 'moder', cls: 'bg-sky-100 text-sky-800 border-sky-300' },
        old: { text: 'old', cls: 'bg-orange-100 text-orange-800 border-orange-300' },
        aktiv: { text: 'aktiv', cls: 'bg-purple-50 text-purple-700 border-purple-200' },
      };
      const item = map[statusKey] || map.aktiv;
      return `<span class="inline-block text-[10px] font-bold lowercase px-2 py-0.5 rounded-full border leading-none ${item.cls}">${item.text}</span>`;
    }

    function openAuthModal(mode = 'login') {
      const modal = document.getElementById('authModal');
      const title = document.getElementById('modalHeaderTitle');
      const body = document.getElementById('modalBody');
      modal.classList.remove('hidden');

      if (mode === 'login') {
        title.textContent = 'Hesaba Giriş';
        body.innerHTML = `
          <div class="space-y-3">
            <div class="bg-purple-50 border border-purple-200 p-2.5 rounded-xl text-xs text-purple-900">
              💡 <b>Test nömrələri:</b><br/>
              👑 Yaradıcı: <b>0708770085</b> (Parol: 051983)<br/>
              🛡️ Admin: <b>0509990001</b> (Parol: 999999)<br/>
              ⚔️ Moder: <b>0703014419</b> (Parol: 432109)
            </div>
            <div>
              <label class="block font-semibold text-purple-950 mb-1">Telefon nömrəsi (+994) *</label>
              <div class="flex items-center gap-1">
                <span class="px-3 py-2 bg-purple-100 border border-purple-200 rounded-xl font-bold text-xs text-purple-900">+994</span>
                <input id="loginPhone" type="tel" placeholder="708770085" class="flex-1 rounded-xl border border-purple-200 px-3 py-2 text-sm font-semibold" />
              </div>
            </div>
            <div>
              <label class="block font-semibold text-purple-950 mb-1">6 rəqəmli parol *</label>
              <input id="loginPin" type="password" maxlength="6" placeholder="••••••" class="w-full rounded-xl border border-purple-200 px-3 py-2 text-center text-lg tracking-widest font-bold" />
            </div>
            <p id="loginError" class="hidden text-xs text-rose-600 font-bold"></p>
            <button type="button" onclick="submitLogin()" class="w-full py-2.5 rounded-xl bg-purple-700 text-white font-bold">Daxil Ol</button>
            <div class="text-center pt-1">
              <button type="button" onclick="openAuthModal('register')" class="text-xs font-bold text-cyan-700 hover:underline">Hesabınız yoxdur? Qeydiyyatdan keçin</button>
            </div>
          </div>
        `;
      } else {
        title.textContent = 'Yeni Üzv Qeydiyyatı';
        body.innerHTML = `
          <div class="space-y-2.5">
            <div class="grid grid-cols-2 gap-2">
              <input id="regFn" type="text" placeholder="Ad" class="rounded-xl border border-purple-200 px-3 py-2 text-xs" />
              <input id="regLn" type="text" placeholder="Soyad" class="rounded-xl border border-purple-200 px-3 py-2 text-xs" />
            </div>
            <div class="flex items-center gap-1">
              <span class="px-2.5 py-2 bg-purple-100 border border-purple-200 rounded-xl font-bold text-xs text-purple-900">+994</span>
              <input id="regPhone" type="tel" placeholder="501234567" class="flex-1 rounded-xl border border-purple-200 px-3 py-2 text-xs font-semibold" />
            </div>
            <input id="regNick" type="text" placeholder="Nik (@ləqəb)" class="w-full rounded-xl border border-purple-200 px-3 py-2 text-xs font-bold text-cyan-800" />
            <input id="regPin1" type="password" maxlength="6" placeholder="6 rəqəmli parol" class="w-full rounded-xl border border-purple-200 px-3 py-2 text-xs text-center tracking-widest font-bold" />
            <input id="regPin2" type="password" maxlength="6" placeholder="Parolu təkrar daxil edin" class="w-full rounded-xl border border-purple-200 px-3 py-2 text-xs text-center tracking-widest font-bold" />
            <p id="regError" class="hidden text-xs text-rose-600 font-bold"></p>
            <button type="button" onclick="submitRegister()" class="w-full py-2.5 rounded-xl bg-cyan-600 text-white font-bold">Qeydiyyatı Göndər</button>
          </div>
        `;
      }
    }

    function closeAuthModal() {
      document.getElementById('authModal').classList.add('hidden');
    }

    function submitLogin() {
      const ph = (document.getElementById('loginPhone').value || '').replace(/\D/g, '');
      const pin = (document.getElementById('loginPin').value || '').trim();
      const err = document.getElementById('loginError');

      const found = state.members.find(m => m.phone.endsWith(ph) && m.pin === pin);
      if (!found) {
        err.textContent = 'Telefon nömrəsi və ya parol yanlışdır.';
        err.classList.remove('hidden');
        return;
      }

      state.currentUser = found;
      saveState();
      closeAuthModal();
      render();
      showToast(`Xoş gəldiniz, ${found.firstName} (${found.nickname})!`);
    }

    function submitRegister() {
      const fn = (document.getElementById('regFn').value || '').trim();
      const ln = (document.getElementById('regLn').value || '').trim();
      const ph = (document.getElementById('regPhone').value || '').replace(/\D/g, '');
      let nick = (document.getElementById('regNick').value || '').trim();
      const pin1 = (document.getElementById('regPin1').value || '').trim();
      const pin2 = (document.getElementById('regPin2').value || '').trim();
      const err = document.getElementById('regError');

      if (!fn || !ln || !ph || !nick || !pin1) {
        err.textContent = 'Bütün xanaları doldurun.';
        err.classList.remove('hidden');
        return;
      }
      if (pin1 !== pin2 || pin1.length !== 6) {
        err.textContent = 'Parollar uyğun gəlmir və ya 6 rəqəmli deyil.';
        err.classList.remove('hidden');
        return;
      }
      if (!nick.startsWith('@')) nick = '@' + nick;

      const newUser = {
        id: 'u_' + Date.now(),
        firstName: fn,
        lastName: ln,
        phone: '0' + ph,
        pin: pin1,
        nickname: nick,
        role: 'member',
        status: 'aktiv',
        isRegistered: true,
        approvedByAdmin: false,
        blockedUsers: []
      };

      state.pendingRegistrations.push(newUser);
      saveState();
      closeAuthModal();
      showToast('Qeydiyyat göndərildi! Admin təsdiqlədikdən sonra daxil ola bilərsiniz.');
      render();
    }

    function approvePendingUser(id) {
      const idx = state.pendingRegistrations.findIndex(p => p.id === id);
      if (idx >= 0) {
        const u = state.pendingRegistrations[idx];
        u.approvedByAdmin = true;
        state.members.push(u);
        state.pendingRegistrations.splice(idx, 1);
        saveState();
        showToast(`${u.firstName} (${u.nickname}) kluba təsdiqləndi!`);
        render();
      }
    }

    function confirmRemoveMember(id, name) {
      if (state.currentUser.role !== 'creator' && state.currentUser.role !== 'admin') return;
      if (confirm(`⚠️ [${name}] qrupdan çıxarılır. Əminsən?`)) {
        state.members = state.members.filter(m => m.id !== id);
        saveState();
        showToast(`${name} qrupdan çıxarıldı.`);
        render();
      }
    }

    function openDmWith(nick) {
      requireMemberAction(() => {
        const target = state.members.find(m => m.nickname === nick || m.id === nick);
        if (target) {
          state.selectedDmUserId = target.id;
          state.activeTab = 'dm';
          render();
        }
      });
    }

    function triggerGroupCall() {
      requireMemberAction(() => {
        const role = state.currentUser.status || state.currentUser.role;
        if (role !== 'creator' && role !== 'admin' && role !== 'moder') {
          showToast('Zəng düyməsi yalnız Yaradıcı, Admin və Moderlər üçündür.');
          return;
        }
        document.getElementById('voiceCallModal').classList.remove('hidden');
      });
    }

    function endVoiceCall() {
      document.getElementById('voiceCallModal').classList.add('hidden');
      showToast('Qrup zəngi başa çatdı.');
    }

    function toggleMuteVoice() {
      const btn = document.getElementById('muteVoiceBtn');
      if (btn.innerText.includes('Bağla')) {
        btn.innerText = '🎙️ Səsi Aç';
        btn.classList.add('bg-rose-800');
      } else {
        btn.innerText = '🎙️ Səsi Bağla';
        btn.classList.remove('bg-rose-800');
      }
    }

    function openAnnDetailModal(annId) {
      const ann = state.announcements.find(a => a.id === annId);
      if (!ann) return;

      const modal = document.getElementById('annDetailModal');
      document.getElementById('annModalTitle').textContent = ann.title;
      
      const attendeesHtml = ann.attendees.map((att, idx) => `
        <div class="flex items-center justify-between p-2 bg-purple-50 rounded-xl border border-purple-100 font-semibold text-xs text-purple-950">
          <span>${idx + 1}. ${att.name}</span>
          <button type="button" onclick="openDmWith('${att.userId}')" class="text-cyan-700 font-bold hover:underline">DM ✉️</button>
        </div>
      `).join('');

      document.getElementById('annModalContent').innerHTML = `
        <div class="space-y-3">
          <div class="text-xs text-purple-700 font-bold">📅 ${ann.date} • 📍 ${ann.location}</div>
          ${ann.isEdited ? '<span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded-full">(Dəyişdirildi)</span>' : ''}
          <p class="text-slate-700 leading-relaxed text-xs sm:text-sm">${ann.description}</p>
          <hr class="border-purple-100" />
          <h4 class="font-extrabold text-purple-950 text-xs sm:text-sm">Qoşulanların Nömrələnmiş Siyahısı (${ann.attendees.length} nəfər):</h4>
          <div class="space-y-1.5">${attendeesHtml || '<p class="text-slate-400">Hələ ki qoşulan yoxdur.</p>'}</div>
        </div>
      `;
      modal.classList.remove('hidden');
    }

    function closeAnnDetailModal() {
      document.getElementById('annDetailModal').classList.add('hidden');
    }

    function toggleBlockUser(targetId) {
      if (state.currentUser.role === 'guest') return;
      const target = state.members.find(m => m.id === targetId);
      if (!target) return;

      if (target.role === 'creator' || target.role === 'admin') {
        showToast('⚠️ Rəhbərlik heyətini (Yaradıcı/Admin) narahat etmə rejiminə keçirmək mümkün deyil.');
        return;
      }

      if (!state.currentUser.blockedUsers) state.currentUser.blockedUsers = [];
      const idx = state.currentUser.blockedUsers.indexOf(targetId);
      if (idx >= 0) {
        state.currentUser.blockedUsers.splice(idx, 1);
        showToast(`${target.firstName} blokdan çıxarıldı.`);
      } else {
        state.currentUser.blockedUsers.push(targetId);
        showToast(`${target.firstName} narahat etmə siyahısına əlavə edildi.`);
      }
      saveState();
      render();
    }

    function openImagePreview(src) {
      document.getElementById('previewImageSrc').src = src;
      document.getElementById('imagePreviewModal').classList.remove('hidden');
    }

    function closeImagePreview() {
      document.getElementById('imagePreviewModal').classList.add('hidden');
    }

    function openCreateNewsModal() {
      document.getElementById('createNewsModal').classList.remove('hidden');
    }

    function closeCreateNewsModal() {
      document.getElementById('createNewsModal').classList.add('hidden');
    }

    function submitNewFeedItem() {
      const title = document.getElementById('newsTitle').value.trim();
      const video = document.getElementById('newsVideoLink').value.trim();
      const desc = document.getElementById('newsDesc').value.trim();
      if (!title) return;

      state.feed.unshift({
        id: 'f_' + Date.now(),
        type: video ? 'video' : 'news',
        title,
        date: 'İndi',
        videoUrl: video,
        desc
      });
      saveState();
      closeCreateNewsModal();
      render();
      showToast('Yeni xəbər paylaşıldı!');
    }

    function sendComplaint() {
      requireMemberAction(() => {
        const text = document.getElementById('complaintText').value.trim();
        if (!text) return;
        state.loungeMessages.push({
          id: 'comp_' + Date.now(),
          senderNick: state.currentUser.nickname,
          senderStatus: '📩 ŞİKAYƏT/TƏKLİF',
          text: `📌 [ŞİKAYƏT/TƏKLİF] - Göndərən: ${state.currentUser.firstName} ${state.currentUser.lastName} (${state.currentUser.nickname})
Mətn: ${text}`,
          time: 'İndi'
        });
        document.getElementById('complaintText').value = '';
        showToast('Şikayət/təklifiniz rəhbərlik otağına göndərildi.');
      });
    }

    function setActiveTab(tab) {
      state.activeTab = tab;
      render();
    }

    function renderHomeView() {
      const isAdmin = state.currentUser.role === 'admin' || state.currentUser.role === 'creator';
      return `
        <div class="space-y-4">
          ${isAdmin ? `<button type="button" onclick="openCreateNewsModal()" class="w-full py-2.5 rounded-2xl bg-purple-700 text-white font-extrabold text-xs sm:text-sm shadow-md">+ Xəbər / Video Əlavə Et</button>` : ''}
          
          ${isAdmin && state.pendingRegistrations.length > 0 ? `
            <div class="bg-amber-50 border border-amber-200 rounded-2xl p-3.5 space-y-2">
              <div class="text-xs font-extrabold text-amber-900">Təsdiq Gözləyən Qeydiyyatlar (${state.pendingRegistrations.length})</div>
              ${state.pendingRegistrations.map(p => `
                <div class="bg-white p-2.5 rounded-xl border border-amber-200 flex items-center justify-between text-xs">
                  <div>
                    <div class="font-bold text-purple-950">${p.firstName} ${p.lastName} (${p.nickname})</div>
                    <div class="text-slate-500">${p.phone}</div>
                  </div>
                  <button type="button" onclick="approvePendingUser('${p.id}')" class="px-3 py-1.5 bg-purple-700 text-white font-bold rounded-lg">Təsdiqlə</button>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <div class="space-y-3">
            <h3 class="text-xs sm:text-sm font-extrabold text-purple-950">Apex Xəbərlər &amp; Video Keçidlər</h3>
            ${state.feed.map(item => `
              <article class="bg-white rounded-2xl p-3.5 border border-purple-100 shadow-2xs space-y-2">
                <div class="flex items-center justify-between text-[11px] font-bold text-purple-700">
                  <span>${item.date}</span>
                  <span class="bg-purple-100 text-purple-800 px-2 py-0.5 rounded-full">${item.type === 'video' ? '🎬 Video' : '📰 Xəbər'}</span>
                </div>
                <h4 class="font-extrabold text-purple-950 text-xs sm:text-sm">${item.title}</h4>
                ${item.videoUrl ? `<div class="aspect-video w-full rounded-xl overflow-hidden bg-black"><iframe class="w-full h-full" src="${item.videoUrl}" frameborder="0" allowfullscreen></iframe></div>` : ''}
                <p class="text-xs text-slate-600 leading-relaxed">${item.desc}</p>
              </article>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAnnouncementsView() {
      return `
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <h3 class="text-xs sm:text-sm font-extrabold text-purple-950">Klub Elanları</h3>
            ${state.currentUser.role === 'admin' || state.currentUser.role === 'creator' ? `
              <button type="button" onclick="showToast('Yeni elan yaratma paneli açıldı.')" class="px-3 py-1.5 bg-cyan-600 text-white font-bold text-xs rounded-xl">+ Yeni Elan Yarat</button>
            ` : ''}
          </div>
          ${state.announcements.map(ann => `
            <div class="bg-white rounded-2xl p-4 border border-purple-100 space-y-2 shadow-2xs">
              <div class="flex items-center justify-between text-xs font-bold text-purple-700">
                <span>📅 ${ann.date}</span>
                <span class="text-cyan-800 font-extrabold">Qatılanlar: ${ann.attendees.length} nəfər</span>
              </div>
              <h4 class="font-extrabold text-purple-950 text-sm">${ann.title}</h4>
              <p class="text-xs text-slate-600">${ann.description}</p>
              <button type="button" onclick="openAnnDetailModal('${ann.id}')" class="w-full py-2 bg-purple-100 text-purple-900 font-bold text-xs rounded-xl hover:bg-purple-200">Elana daxil ol (Siyahı)</button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderChatView() {
      const isAdminOrCreator = state.currentUser.role === 'admin' || state.currentUser.role === 'creator';
      const messages = state.activeChatSubTab === 'lounge' ? state.loungeMessages : state.chatMessages;

      return `
        <div class="flex flex-col h-full bg-white rounded-2xl border border-purple-100 overflow-hidden shadow-2xs">
          <!-- TOP BAR -->
          <div class="p-2 bg-purple-50 border-b border-purple-100 flex items-center justify-between">
            <div class="flex gap-1">
              <button type="button" onclick="state.activeChatSubTab='public'; render();" class="px-3 py-1.5 rounded-xl text-xs font-bold ${state.activeChatSubTab==='public'?'bg-purple-700 text-white':'bg-white text-purple-950'}">💬 Ümumi Söhbət</button>
              ${isAdminOrCreator ? `
                <button type="button" onclick="state.activeChatSubTab='lounge'; render();" class="px-3 py-1.5 rounded-xl text-xs font-bold ${state.activeChatSubTab==='lounge'?'bg-blue-900 text-white':'bg-blue-100 text-blue-900'}">🛡️ Rəhbərlik Otağı</button>
              ` : ''}
            </div>
            ${(state.currentUser.role==='creator' || state.currentUser.role==='admin' || state.currentUser.status==='moder') ? `
              <button type="button" onclick="triggerGroupCall()" class="px-2.5 py-1.5 rounded-xl bg-emerald-600 text-white text-xs font-bold">📞 Qrupa zəng et</button>
            ` : ''}
          </div>

          <!-- MESSAGES -->
          <div class="flex-1 overflow-y-auto soft-scroll p-3 space-y-2.5 bg-[#F7F6FC]">
            ${messages.map(m => `
              <div class="flex flex-col items-start">
                <div class="mb-0.5 flex items-center gap-1">
                  <button type="button" onclick="openDmWith('${m.senderNick}')" class="text-xs font-extrabold text-cyan-800 hover:underline">${m.senderNick}</button>
                  ${getStatusBadgeHtml(m.senderStatus)}
                </div>
                <div class="max-w-[85%] px-3 py-2 rounded-2xl text-xs bg-white text-purple-950 border border-purple-100 shadow-2xs">
                  ${m.text}
                </div>
              </div>
            `).join('')}
          </div>

          <!-- INPUT BAR -->
          <div class="p-2 bg-white border-t border-purple-100 flex items-center gap-2">
            <input id="chatInput" type="text" placeholder="Mesaj yazın (@nik tağ et)..." class="flex-1 rounded-xl border border-purple-200 px-3 py-2 text-xs" />
            <button type="button" onclick="sendChatMessage()" class="px-3.5 py-2 rounded-xl bg-purple-700 text-white font-bold text-xs">Göndər</button>
          </div>
        </div>
      `;
    }

    function sendChatMessage() {
      requireMemberAction(() => {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text) return;

        const msg = {
          id: 'm_' + Date.now(),
          senderId: state.currentUser.id,
          senderNick: state.currentUser.nickname,
          senderStatus: state.currentUser.status || state.currentUser.role,
          text,
          time: 'İndi'
        };

        if (state.activeChatSubTab === 'lounge') state.loungeMessages.push(msg);
        else state.chatMessages.push(msg);

        input.value = '';
        render();
      });
    }

    function renderGamesView() {
      return `
        <div class="space-y-4">
          <div class="bg-gradient-to-r from-purple-800 to-cyan-600 rounded-2xl p-4 text-white space-y-1">
            <h3 class="font-extrabold text-base">🎮 Klub İntellektual Oyunlar Zonası</h3>
            <p class="text-xs opacity-90">Nərd, Domino (2/4 nəfərlik), Durak və Liderlər lövhəsi</p>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <button type="button" onclick="requireMemberAction(() => showToast('🎲 Nərd masası açılır...'))" class="p-3 bg-white border border-purple-100 rounded-2xl text-center space-y-1 shadow-2xs">
              <span class="text-2xl">🎲</span>
              <div class="font-extrabold text-xs text-purple-950">Nərd 1v1</div>
            </button>
            <button type="button" onclick="requireMemberAction(() => showToast('🀏 Domino masası açılır...'))" class="p-3 bg-white border border-purple-100 rounded-2xl text-center space-y-1 shadow-2xs">
              <span class="text-2xl">🀏</span>
              <div class="font-extrabold text-xs text-purple-950">Domino 2/4</div>
            </button>
            <button type="button" onclick="requireMemberAction(() => showToast('🃏 Durak masası açılır...'))" class="p-3 bg-white border border-purple-100 rounded-2xl text-center space-y-1 shadow-2xs">
              <span class="text-2xl">🃏</span>
              <div class="font-extrabold text-xs text-purple-950">Durak 2/4</div>
            </button>
          </div>

          <div class="bg-white rounded-2xl p-4 border border-purple-100 space-y-3">
            <h4 class="font-extrabold text-purple-950 text-xs sm:text-sm">🏆 Liderlər Lövhəsi Və Canlı Oyunçular</h4>
            <div class="space-y-2">
              ${state.leaderboard.map(u => `
                <div class="flex items-center justify-between p-2.5 rounded-xl border border-purple-100 bg-purple-50/50 text-xs">
                  <div class="flex items-center gap-2">
                    <span class="font-bold text-purple-700">#${u.rank}</span>
                    <span class="font-bold text-purple-950">${u.name}</span>
                    <span class="${u.online ? 'text-emerald-600' : 'text-slate-400'} font-bold">● ${u.online ? 'Onlayn' : 'Oflayn'}</span>
                  </div>
                  <button type="button" onclick="requireMemberAction(() => showToast('${u.name} istifadəçisinə meydan oxundu! ⚔️'))" class="px-2.5 py-1 bg-cyan-600 text-white font-bold rounded-lg text-[11px]">Meydan oxu ⚔️</button>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderDmView() {
      if (state.currentUser.role === 'guest') {
        return `<div class="p-6 bg-white rounded-2xl text-center text-xs font-bold text-purple-950">Şəxsi mesajlaşma üçün daxil olun.</div>`;
      }

      const peers = state.members.filter(m => m.id !== state.currentUser.id);
      const activePeer = peers.find(p => p.id === state.selectedDmUserId) || peers[0];
      const isBlocked = state.currentUser.blockedUsers?.includes(activePeer?.id);

      return `
        <div class="flex flex-col h-full bg-white rounded-2xl border border-purple-100 overflow-hidden">
          <div class="p-2 border-b border-purple-100 flex items-center justify-between bg-purple-50">
            <span class="font-bold text-xs text-purple-950">${activePeer ? activePeer.firstName + ' (' + activePeer.nickname + ')' : 'DM'}</span>
            ${activePeer ? `
              <button type="button" onclick="toggleBlockUser('${activePeer.id}')" class="px-2.5 py-1 text-[11px] font-bold rounded-lg border ${isBlocked?'bg-rose-100 text-rose-800 border-rose-300':'bg-slate-100 text-slate-700'}">
                ${isBlocked ? '🚫 Bloklanıb' : '🚫 Narahat etmə'}
              </button>
            ` : ''}
          </div>

          <div class="flex-1 p-3 overflow-y-auto soft-scroll space-y-2 bg-[#F7F6FC]">
            ${(state.dmThreads[activePeer?.id] || []).map(m => `
              <div class="flex flex-col ${m.fromMe ? 'items-end' : 'items-start'}">
                <div class="px-3 py-2 rounded-2xl text-xs ${m.fromMe ? 'bg-cyan-600 text-white' : 'bg-white border border-purple-100 text-purple-950'}">
                  ${m.text}
                </div>
              </div>
            `).join('')}
          </div>

          ${isBlocked ? `
            <div class="p-3 bg-slate-100 text-center text-xs font-bold text-slate-600">🔒 Bu şəxsə mesaj göndərə bilməzsiniz.</div>
          ` : `
            <div class="p-2 border-t border-purple-100 flex items-center gap-2">
              <input id="dmInput" type="text" placeholder="Şəxsi mesaj..." class="flex-1 rounded-xl border border-purple-200 px-3 py-2 text-xs" />
              <button type="button" onclick="sendDmMessage()" class="px-3.5 py-2 bg-cyan-600 text-white font-bold text-xs rounded-xl">Göndər</button>
            </div>
          `}
        </div>
      `;
    }

    function sendDmMessage() {
      const input = document.getElementById('dmInput');
      const text = input.value.trim();
      if (!text) return;
      if (!state.dmThreads[state.selectedDmUserId]) state.dmThreads[state.selectedDmUserId] = [];
      state.dmThreads[state.selectedDmUserId].push({ id: 'dm_' + Date.now(), fromMe: true, text, time: 'İndi' });
      input.value = '';
      render();
    }

    function renderMembersView() {
      const isCreator = state.currentUser.role === 'creator';
      const isAdmin = state.currentUser.role === 'admin';

      return `
        <div class="space-y-3">
          <h3 class="text-xs sm:text-sm font-extrabold text-purple-950">Apex Klub Üzvləri (${state.members.length})</h3>
          <div class="space-y-2">
            ${state.members.map(m => `
              <div class="bg-white p-3 rounded-2xl border border-purple-100 flex items-center justify-between text-xs shadow-2xs">
                <div>
                  <div class="font-extrabold text-purple-950 flex items-center gap-1.5">
                    <span>${m.firstName} ${m.lastName}</span>
                    <button type="button" onclick="openDmWith('${m.id}')" class="text-cyan-700 font-bold hover:underline">(${m.nickname})</button>
                    ${getStatusBadgeHtml(m.status || m.role)}
                  </div>
                  <div class="text-slate-500 text-[11px] mt-0.5">${m.phone}</div>
                </div>
                ${(isCreator || isAdmin) && m.id !== state.currentUser.id ? `
                  <button type="button" onclick="confirmRemoveMember('${m.id}', '${m.firstName} ${m.lastName}')" class="px-2.5 py-1 bg-rose-50 text-rose-700 font-bold border border-rose-200 rounded-lg text-[11px]">Çıxar</button>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderAccountView() {
      if (state.currentUser.role === 'guest') {
        return `
          <div class="bg-white rounded-2xl p-6 text-center space-y-4 border border-purple-100">
            <h3 class="font-extrabold text-purple-950 text-base">Hesab Bölməsi (Qonaq)</h3>
            <p class="text-xs text-slate-600">Tam imkanlardan yararlanmaq üçün giriş edin.</p>
            <button type="button" onclick="openAuthModal('login')" class="w-full py-3 bg-purple-700 text-white font-bold rounded-xl text-xs">Giriş Et</button>
          </div>
        `;
      }

      return `
        <div class="space-y-4">
          <div class="bg-white rounded-2xl p-4 border border-purple-100 space-y-3">
            <div class="flex items-center justify-between border-b border-purple-100 pb-2">
              <h3 class="font-extrabold text-purple-950 text-xs sm:text-sm">Profil Məlumatları</h3>
              <button type="button" onclick="state.currentUser={...GUEST_USER}; saveState(); render();" class="text-xs font-bold text-rose-600">Çıxış et</button>
            </div>
            <div class="space-y-2 text-xs">
              <div class="p-2 bg-purple-50 rounded-xl">Ad Soyad: <b>${state.currentUser.firstName} ${state.currentUser.lastName}</b></div>
              <div class="p-2 bg-purple-50 rounded-xl">Telefon: <b>${state.currentUser.phone}</b></div>
              <div class="p-2 bg-cyan-50 rounded-xl border border-cyan-100">Nik (6 aydan bir dəyişir): <b>${state.currentUser.nickname}</b></div>
            </div>
          </div>

          <!-- COMPLAINTS / SUGGESTIONS -->
          <div class="bg-white rounded-2xl p-4 border border-purple-100 space-y-2.5">
            <h4 class="font-extrabold text-purple-950 text-xs sm:text-sm">📩 Şikayət Və Təkliflər Bölməsi</h4>
            <p class="text-[11px] text-slate-500">Yazdığınız şikayət və təkliflər avtomatik Rəhbərlik Otağına göndərilir.</p>
            <textarea id="complaintText" rows="3" placeholder="Şikayət və təklifinizi bura yazın..." class="w-full rounded-xl border border-purple-200 p-2.5 text-xs"></textarea>
            <button type="button" onclick="sendComplaint()" class="w-full py-2 bg-purple-700 text-white font-bold text-xs rounded-xl">Rəhbərliyə Göndər</button>
          </div>
        </div>
      `;
    }

    function render() {
      renderTopRoleBadge();
      
      const buttons = document.querySelectorAll('.nav-btn');
      buttons.forEach(btn => {
        const key = btn.getAttribute('data-nav');
        if (key === state.activeTab) {
          btn.classList.add('bg-purple-100', 'text-purple-900', 'font-bold');
        } else {
          btn.classList.remove('bg-purple-100', 'text-purple-900', 'font-bold');
        }
      });

      const container = document.getElementById('mainContainer');
      if (state.activeTab === 'home') container.innerHTML = renderHomeView();
      else if (state.activeTab === 'announcements') container.innerHTML = renderAnnouncementsView();
      else if (state.activeTab === 'chat') container.innerHTML = renderChatView();
      else if (state.activeTab === 'games') container.innerHTML = renderGamesView();
      else if (state.activeTab === 'dm') container.innerHTML = renderDmView();
      else if (state.activeTab === 'members') container.innerHTML = renderMembersView();
      else if (state.activeTab === 'account') container.innerHTML = renderAccountView();
    }

    window.onload = function() {
      render();
    };
  </script>
</body>
</html>
